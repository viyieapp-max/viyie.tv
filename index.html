    <script>
      // Prevent React from crashing when Google Translate replaces text nodes with <font> tags.
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>

    <div id="root">
      <!-- Fallback loading screen shown while JS loads/parses -->
      <script>window.__bootStart = Date.now();</script>
      <div id="boot-fallback" style="position:fixed;inset:0;background:#070404;display:flex;align-items:center;justify-content:center;z-index:10001">
        <div style="position:relative;width:48px;height:48px;">

    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: 'en', autoDisplay: false },
          'google_translate_element'
        );
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((error) => {
            console.error('Service Worker registration failed:', error);
          });
        });
      }
    </script>
